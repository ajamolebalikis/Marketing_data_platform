# Used with `--profiles-dir .`  Contains NO secrets, only env-var references.
marketing_platform:
  target: dev
  outputs:
    # ---------- Developer sandbox: personal access token, personal schema ----------
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: analytics_development
      schema: "dbt_{{ env_var('DBT_USER', 'dev') }}"
      threads: 4

    # ---------- CI: one throw-away set of schemas per pull request ----------
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN_CI') }}"
      catalog: ci_development
      schema: "pr_{{ env_var('PR_NUMBER', 'local') }}"
      threads: 4

    # ---------- Production: Service Principal (OAuth M2M). NO personal token. ----------
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
      catalog: analytics_production
      schema: analytics
      threads: 8

# Profile used by the Elementary CLI (edr). Schema must equal "<dbt target schema>_elementary"
# in dev/ci, and exactly "elementary" in prod (see macros/generate_schema_name.sql).
elementary:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: analytics_development
      schema: "dbt_{{ env_var('DBT_USER', 'dev') }}_elementary"
      threads: 4
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN_CI') }}"
      catalog: ci_development
      schema: "pr_{{ env_var('PR_NUMBER', 'local') }}_elementary"
      threads: 4
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
      catalog: analytics_production
      schema: elementary
      threads: 4
