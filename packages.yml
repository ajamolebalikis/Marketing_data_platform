# Version ranges so `dbt deps` picks a compatible release.
# After the first successful `dbt deps`, commit package-lock.yml to freeze exact versions.
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
  - package: elementary-data/elementary
    version: [">=0.19.0", "<1.0.0"]
