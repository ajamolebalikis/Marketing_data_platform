version: 2
seeds:
  - name: currency_rates
    description: >
      Static conversion rates into the reporting currency (EUR). ASSUMPTION: one flat rate per
      currency. USD=0.92 is a placeholder; replace with the finance-approved rate, or evolve this
      into a dated rate table (currency_code, rate_date, rate_to_eur) if you need historical accuracy.
    columns:
      - name: currency_code
        description: ISO 4217 currency code.
        data_tests:
          - unique
          - not_null
      - name: rate_to_eur
        description: Multiply an amount in currency_code by this value to get EUR.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
